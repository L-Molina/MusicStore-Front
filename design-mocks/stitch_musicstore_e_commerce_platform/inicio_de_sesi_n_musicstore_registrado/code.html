<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                "primary-fixed": "#ffdad4",
                "on-secondary-container": "#b7b5b4",
                "on-tertiary-fixed": "#1b1c1c",
                "surface-dim": "#121414",
                "secondary": "#c8c6c5",
                "on-tertiary-container": "#e4e1e1",
                "outline-variant": "#5e3f3a",
                "on-secondary": "#313030",
                "error-container": "#93000a",
                "primary-fixed-dim": "#ffb4a8",
                "tertiary": "#c8c6c6",
                "background": "#000000",
                "error": "#ffb4ab",
                "tertiary-container": "#656464",
                "secondary-fixed-dim": "#c8c6c5",
                "outline": "#333333",
                "inverse-surface": "#e2e2e2",
                "tertiary-fixed": "#e4e2e1",
                "on-background": "#e2e2e2",
                "on-secondary-fixed": "#1c1b1b",
                "surface-container": "#1a1a1a",
                "on-primary-container": "#ffdad4",
                "on-error-container": "#ffdad6",
                "tertiary-fixed-dim": "#c8c6c6",
                "on-error": "#690005",
                "inverse-on-surface": "#2f3131",
                "on-primary-fixed": "#410000",
                "surface": "#121414",
                "inverse-primary": "#c00000",
                "surface-bright": "#37393a",
                "secondary-fixed": "#e5e2e1",
                "on-tertiary-fixed-variant": "#474747",
                "on-surface": "#e2e2e2",
                "on-primary": "#690000",
                "surface-tint": "#ffb4a8",
                "primary": "#cc0000",
                "secondary-container": "#474746",
                "on-primary-fixed-variant": "#930000",
                "surface-container-high": "#282a2b",
                "primary-container": "#cc0000",
                "surface-container-highest": "#333535",
                "surface-variant": "#333535",
                "on-tertiary": "#303030",
                "on-secondary-fixed-variant": "#474746",
                "surface-container-lowest": "#0c0f0f",
                "surface-container-low": "#1a1c1c",
                "on-surface-variant": "#e8bdb6"
            },
            "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
            },
            "fontFamily": {
                "headline-xl": ["Plus Jakarta Sans"],
                "headline-lg": ["Plus Jakarta Sans"],
                "label-md": ["Plus Jakarta Sans"],
                "body-lg": ["Plus Jakarta Sans"],
                "label-sm": ["Plus Jakarta Sans"],
                "headline-md": ["Plus Jakarta Sans"],
                "body-md": ["Plus Jakarta Sans"]
            }
          },
        }
      }
    </script>
<style>
        body {
            background-color: #000000;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen items-center justify-center p-6 bg-background text-on-background">
<div class="w-full max-w-md">
<!-- Logo Section -->
<div class="flex flex-col items-center mb-12">
<img alt="MusicStore Logo" class="h-20 w-auto mb-4" data-alt="high-end minimalist vector logo for MusicStore, bold sharp lines with a modern abstract musical note symbol in vibrant red" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBFeyAbyZHB22iMqccYqiCF4lmjggWeS79n5-w8usKH3Tmh8BFNx2mDXxLXkNMh0bCKM_M6-LiiY0hvDyb79Ma9-Mbq4plwsXDslUWo72TXyUSB4PISCHYjzfTRzhQuj9F8wv4l0BK3nN2V68G6gNwHNayQ_TFwWjiNJIv-aKg0DraQRXKFS5owysm5c_nFkcR5CGaGSkqBbrl3jvfVGZ3EyoIy1pzyBuhFqQy1ONg_GuPP0KxabjWQkaFn54UgtoV6i6mtNJPU11Q"/>
<h1 class="font-headline-xl text-headline-xl text-primary tracking-tighter">MusicStore</h1>
<p class="font-label-md text-label-md text-on-secondary-container uppercase tracking-widest mt-2">Premium Audio</p>
</div>
<!-- Login Container -->
<div class="bg-surface-container border border-outline p-8 rounded-lg shadow-2xl">
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface uppercase" for="email">Email</label>
<input class="w-full bg-background border border-outline rounded-lg px-4 py-3 text-on-surface focus:outline-none focus:border-primary transition-colors font-body-md text-body-md placeholder-secondary-container" id="email" placeholder="nombre@ejemplo.com" type="email"/>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface uppercase" for="password">Password</label>
<a class="text-xs font-label-sm text-secondary hover:text-primary transition-colors" href="#">¿Olvidaste tu contraseña?</a>
</div>
<div class="relative">
<input class="w-full bg-background border border-outline rounded-lg px-4 py-3 text-on-surface focus:outline-none focus:border-primary transition-colors font-body-md text-body-md placeholder-secondary-container" id="password" placeholder="********" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-secondary hover:text-on-surface" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Checkbox -->
<div class="flex items-center space-x-2">
<input class="w-4 h-4 rounded border-outline bg-background text-primary focus:ring-primary focus:ring-offset-background" id="remember" type="checkbox"/>
<label class="font-label-sm text-label-sm text-on-secondary-container" for="remember">Mantener sesión iniciada</label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-red-700 text-white font-headline-md text-headline-md py-4 rounded-lg transition-all active:scale-[0.98] uppercase tracking-wider" type="submit">
                    INICIAR SESIÓN
                </button>
</form>
<!-- Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline"></div>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-surface-container px-4 text-on-secondary-container font-label-sm">O continúa con</span>
</div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 bg-background border border-outline rounded-lg py-3 hover:bg-surface-container-high transition-colors font-label-md text-label-md">
<span class="material-symbols-outlined" data-icon="google">google</span>
                    Google
                </button>
<button class="flex items-center justify-center gap-3 bg-background border border-outline rounded-lg py-3 hover:bg-surface-container-high transition-colors font-label-md text-label-md">
<span class="material-symbols-outlined" data-icon="apple">ios</span>
                    Apple
                </button>
</div>
</div>
<!-- Footer Link -->
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-secondary-container">
                ¿No tienes una cuenta? 
                <a class="text-primary font-bold hover:underline ml-1" href="#">Regístrate gratis</a>
</p>
</div>
</div>
</body></html>
