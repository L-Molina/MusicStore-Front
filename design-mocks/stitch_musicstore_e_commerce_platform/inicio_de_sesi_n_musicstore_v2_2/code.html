<body class="font-body-md text-on-surface antialiased">
<!-- Auth Container -->
<div class="min-h-screen flex flex-col items-center justify-center px-6 py-xl">
<!-- Brand Identity Section -->
<div class="flex flex-col items-center mb-4">
<div class="flex items-center justify-center w-64 h-64">
<img alt="MusicStore Logo" class="w-full h-full object-contain" data-alt="Sleek minimalist red electric guitar silhouette icon on a black background, professional music store branding" src="https://lh3.googleusercontent.com/aida/ADBb0uh2I0K_YA1OHo3wKwDc0NbwaGZC2KDBkrav8WfqhLaHwSfMFpZlz_i71zATLIByBrqdY5sB9XIz_qtLfU8tX7_r5pf2vyqZREorMhWHP7ZNk3oltKI2wQd_6smVgzvlBQc_98Bf60nSkFTNrNbQz-F3cMMkXNAzBtyjl1K5tw30Qp26aL9_hbPLNlJQ5AkNXQGVI59UI3gZpkBmOTfMtqaOTz9tC972AaWr_baOPfHcQ26RQjbUkuU0vw"/>
</div>
</div>
<!-- Login Form Card -->
<div class="w-full max-w-md bg-surface-container-low border border-outline-variant p-lg rounded-xl shadow-2xl">
<form class="space-y-md">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-secondary ml-1">Correo Electrónico</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-secondary group-focus-within:text-primary-container transition-colors">mail</span>
<input class="w-full bg-black border border-outline-variant rounded-lg py-3 pl-10 pr-4 text-on-surface placeholder:text-on-secondary-fixed-variant focus:outline-none focus:border-primary-container transition-all" placeholder="tu@correo.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-secondary ml-1">Contraseña</label>
<a class="font-label-sm text-label-sm text-primary-container hover:underline" href="#">¿Olvidaste tu contraseña?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-secondary group-focus-within:text-primary-container transition-colors">lock</span>
<input class="w-full bg-black border border-outline-variant rounded-lg py-3 pl-10 pr-12 text-on-surface placeholder:text-on-secondary-fixed-variant focus:outline-none focus:border-primary-container transition-all" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-secondary hover:text-on-surface" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center space-x-2">
<input class="w-4 h-4 rounded border-outline-variant bg-black text-primary-container focus:ring-primary-container focus:ring-offset-black" id="remember" type="checkbox"/>
<label class="font-label-md text-label-md text-secondary" for="remember">Mantener sesión iniciada</label>
</div>
<!-- Main Login Button -->
<button class="w-full bg-primary-container hover:bg-inverse-primary text-white font-headline-md text-headline-md py-4 rounded-lg transition-all active:scale-95 duration-150 shadow-lg" type="submit">
                    INICIAR SESIÓN
                </button>
</form>
<!-- Divider -->
<div class="relative my-lg">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-xs">
<span class="bg-surface-container-low px-4 text-secondary font-label-md tracking-widest">O CONTINÚA CON</span>
</div>
</div>
<!-- Social Auth Grid -->
<div class="grid grid-cols-2 gap-gutter">
<button class="flex items-center justify-center space-x-2 border border-outline-variant bg-black hover:border-secondary py-3 rounded-lg transition-colors group active:scale-95">
<img alt="Google" class="w-5 h-5" data-alt="Google colorful logo icon minimalist" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAe8LIB_fMvkmIVJXt1lvpA5izbhZdaGz4kOHOmeseWgQi3MMtTkGWwk6saZIpThRTmivLdqUjMWHkYvt-yrvzMIY6eJZ-wJbY4HzdRqeKdT0b--L_A2hvE3EjViW735mcA9yb_wu43IkXW4-WEcFvoocvY8sA1zLpiHismDyrYUq5ugSWYDhXsaqzEgnz9KZJSEXt5kuEDKcCcbNEjEK9QmxulShIcAVMgJdvyHgeZCoNnxVVgbBajSjiinrL0hxH4dTWkVY2QWp4"/>
<span class="font-label-md text-on-surface">GOOGLE</span>
</button>
<button class="flex items-center justify-center space-x-2 border border-outline-variant bg-black hover:border-secondary py-3 rounded-lg transition-colors group active:scale-95">
<span class="material-symbols-outlined text-on-surface" style="font-variation-settings: 'FILL' 1;">ios</span>
<span class="font-label-md text-on-surface">APPLE</span>
</button>
</div>
<!-- Registration Link -->
<div class="mt-lg text-center">
<p class="font-body-md text-on-surface-variant">
                    ¿Aún no tienes cuenta? 
                    <a class="text-primary-container font-semibold hover:underline decoration-2 underline-offset-4 ml-1" href="#">Regístrate gratis</a>
</p>
</div>
</div>
<!-- Footer Visual Hint -->
<div class="mt-xl max-w-sm text-center">
<p class="text-on-secondary-fixed-variant font-label-sm leading-relaxed">
                Al iniciar sesión, aceptas nuestros Términos de Servicio y Política de Privacidad. MusicStore es una plataforma profesional de audio.
            </p>
</div>
</div>
