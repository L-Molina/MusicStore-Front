<!DOCTYPE html>

                "on-secondary": "#313030",

                "margin": "32px",
                "base": "8px"
            },
            "fontFamily": {
                "label-sm": ["Plus Jakarta Sans"],
                "label-md": ["Plus Jakarta Sans"],
                "headline-xl": ["Plus Jakarta Sans"],

<style>
        body {
            background-color: #121414;
            color: #e2e2e2;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .login-gradient {
            background: radial-gradient(circle at 50% -20%, #2a1111 0%, #121414 70%);
        }
        .glass-panel {
            background: rgba(30, 32, 32, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="font-body-md text-body-md antialiased min-h-screen flex flex-col justify-center items-center overflow-x-hidden login-gradient">
<!-- Auth Container -->
<main class="w-full max-w-[440px] px-margin py-xl flex flex-col items-center">
<!-- Brand Header -->
<header class="mb-lg flex flex-col items-center space-y-md">
<img alt="MusicStore Identity" class="h-20 w-auto" data-alt="Modern geometric red and white musical instrument logo icon on a black background, professional and high-contrast" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD_BgJz6L8Ml3MgJ0XrroUPAtuTScaBf0yhdCf1s7DWtsOAgbv4LKjI7v6lEeUQdkIz5bfoQZV_pAKlx4YaiI_xiEn9uUZHohHwJOydl7s-P9XsenDowNChA3gyX7sbIAbPpit8qiqGke52spkeeZeQCqqGI8HzZKXPkEEEiTfunEtH48elLQWTNcGyL8lDN0SxGo9ygpKLDEabcN6ta2-2iQNEzVRQxNi5lWLiuZGjTux7_4dzaIsDG2jUQdaXAbXKFz8GwSEPJ4w"/>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">MusicStore</h1>
<p class="font-body-md text-body-md text-neutral-500 text-center">Accede a tu equipo profesional y novedades musicales</p>
</header>
<!-- Login Card -->
<section class="w-full glass-panel p-lg rounded-xl flex flex-col space-y-gutter shadow-2xl">
<form class="flex flex-col space-y-md">
<!-- Email Field -->
<div class="flex flex-col space-y-xs">
<label class="font-label-md text-label-md text-neutral-400" for="email">CORREO ELECTRÓNICO</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-neutral-500 group-focus-within:text-primary-container transition-colors">mail</span>
<input class="w-full bg-surface-container-lowest border border-neutral-800 rounded-lg py-3.5 pl-12 pr-4 text-on-surface focus:ring-1 focus:ring-primary-container focus:border-primary-container transition-all outline-none placeholder:text-neutral-600" id="email" placeholder="ejemplo@email.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col space-y-xs">
<div class="flex justify-between items-end">
<label class="font-label-md text-label-md text-neutral-400" for="password">CONTRASEÑA</label>
<a class="font-label-sm text-label-sm text-neutral-500 hover:text-white transition-colors" href="#">¿Olvidaste tu contraseña?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-neutral-500 group-focus-within:text-primary-container transition-colors">lock</span>
<input class="w-full bg-surface-container-lowest border border-neutral-800 rounded-lg py-3.5 pl-12 pr-4 text-on-surface focus:ring-1 focus:ring-primary-container focus:border-primary-container transition-all outline-none placeholder:text-neutral-600" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-neutral-500 hover:text-white transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center space-x-sm">
<input class="w-4 h-4 rounded border-neutral-800 bg-surface-container-lowest text-primary-container focus:ring-primary-container" id="remember" type="checkbox"/>
<label class="font-label-md text-label-md text-neutral-400 cursor-pointer" for="remember">Mantener sesión iniciada</label>
</div>
<!-- Action Button -->
<button class="w-full bg-primary-container text-white font-headline-md text-headline-md py-4 rounded-lg hover:brightness-110 active:scale-[0.98] transition-all duration-200 uppercase tracking-widest mt-base" type="submit">
                    INICIAR SESIÓN
                </button>
</form>
<!-- Social Login Divider -->
<div class="relative py-base">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-neutral-800"></div>
</div>
<div class="relative flex justify-center text-label-sm uppercase">
<span class="bg-[#1e2020] px-4 text-neutral-600">O continúa con</span>
</div>
</div>
<!-- Social Buttons -->
<div class="grid grid-cols-2 gap-sm">
<button class="flex items-center justify-center space-x-2 py-3 border border-neutral-800 rounded-lg hover:bg-neutral-900 transition-colors">
<img alt="Google" class="w-5 h-5 grayscale opacity-70 group-hover:grayscale-0" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDgtMFhWcQdL5ZrDRTi7NVOlhorVwIKC0PBKARRn9jSs5a3BK8LCZHcqgUW_J4NxV8_ZKWksZ0YNirmVEQmY_Mu61jNuJe0IwXN51wNZWLMPFwR16vX86QpZ9txPEwriTCStCAXNvGugUBxDCpr7Fvc5QeTi0HvZIHJ6mISL7JsHORyT8cZC8r2B1Q-hQX5XKh_tPLZAbPHGF6at2hp58leWtE8bfyRZIudKcnrxe2ffJVO221U7wiEgz_l4LVPSIFelBAL8r7paLo"/>
<span class="font-label-md text-label-md text-neutral-400">GOOGLE</span>
</button>
<button class="flex items-center justify-center space-x-2 py-3 border border-neutral-800 rounded-lg hover:bg-neutral-900 transition-colors">
<span class="material-symbols-outlined text-neutral-400" style="font-variation-settings: 'FILL' 1;">ios</span>
<span class="font-label-md text-label-md text-neutral-400">APPLE</span>
</button>
</div>
</section>
<!-- Footer Link -->
<footer class="mt-lg text-center">
<p class="font-body-md text-body-md text-neutral-500">
                ¿Aún no tienes cuenta? 
                <a class="text-primary hover:text-primary-container font-bold transition-colors ml-1" href="#">Regístrate gratis</a>
</p>
</footer>
</main>
<!-- Visual Utility Elements -->
<div class="fixed bottom-0 left-0 w-full p-gutter flex justify-between items-center opacity-30 pointer-events-none">
<div class="text-[10px] font-mono tracking-widest text-neutral-500 uppercase">System Status: Optimal</div>
<div class="text-[10px] font-mono tracking-widest text-neutral-500 uppercase">Secure Encryption v.2.4.0</div>
</div>
</body></html>
